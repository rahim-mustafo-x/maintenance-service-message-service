<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Chat · Message Mutation Tester</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f3f4f6;
            --sidebar-bg: #ffffff;
            --chat-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #dbeafe;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Login Overlay */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 { margin-top: 0; color: var(--primary); }
        .login-card input {
            width: 100%;
            padding: 0.75rem;
            margin: 1rem 0;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            box-sizing: border-box;
        }
        .login-card button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conv-list {
            flex: 1;
            overflow-y: auto;
        }
        .conv-item {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .conv-item:hover { background: var(--bg); }
        .conv-item.active { background: var(--accent); border-left: 4px solid var(--primary); }
        .avatar {
            width: 40px;
            height: 40px;
            background: #cbd5e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
        }
        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
        }
        .messages-container {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #f9fafb;
        }
        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }
        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0.2rem;
        }
        .message.received {
            align-self: flex-start;
            background: #e5e7eb;
            color: var(--text);
            border-bottom-left-radius: 0.2rem;
        }
        .message-meta {
            font-size: 0.7rem;
            margin-top: 0.25rem;
            opacity: 0.8;
            text-align: right;
        }

        .input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            background: white;
        }
        .input-area input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
        }
        .input-area button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }
        .hidden { display: none !important; }

        .sidebar-actions { display: flex; align-items: center; gap: 0.75rem; }
        .new-chat-btn {
            border: 0; border-radius: 0.5rem; padding: 0.55rem 0.75rem;
            background: var(--primary); color: white; font-weight: 600; cursor: pointer;
        }
        .modal-overlay {
            position: fixed; inset: 0; z-index: 900; display: flex;
            align-items: center; justify-content: center; padding: 1rem;
            background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px);
        }
        .modal-card {
            width: 100%; max-width: 440px; max-height: 80vh; overflow: hidden;
            background: white; border-radius: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,.2);
            display: flex; flex-direction: column;
        }
        .modal-heading {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border);
        }
        .modal-heading h3 { margin: 0; }
        .icon-btn { border: 0; background: transparent; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }
        .user-search { margin: 1rem 1.25rem 0; padding: .8rem; border: 1px solid var(--border); border-radius: .5rem; font: inherit; }
        .user-results { overflow-y: auto; padding: .5rem .75rem 1rem; }
        .user-result {
            width: 100%; display: flex; align-items: center; gap: .75rem;
            padding: .75rem; border: 0; border-radius: .6rem; background: white;
            text-align: left; cursor: pointer; color: var(--text);
        }
        .user-result:hover { background: var(--bg); }
        .user-result .user-name { flex: 1; font-weight: 600; }
        .user-result .start-label { color: var(--primary); font-size: .85rem; }
        .modal-status { padding: .5rem 1.25rem 1rem; color: var(--text-muted); font-size: .9rem; }

        .message { cursor: context-menu; overflow-wrap: anywhere; }
        .message.deleted { opacity: .72; font-style: italic; }
        .message-context-menu {
            position: fixed; z-index: 1200; min-width: 150px; padding: .35rem;
            background: #fff; color: var(--text); border: 1px solid var(--border);
            border-radius: .7rem; box-shadow: 0 12px 30px rgba(15,23,42,.2);
        }
        .message-context-menu button {
            display: block; width: 100%; border: 0; background: transparent;
            text-align: left; padding: .7rem .8rem; border-radius: .45rem;
            color: var(--text); cursor: pointer; font: inherit;
        }
        .message-context-menu button:hover { background: var(--bg); }
        .message-context-menu button.danger { color: #dc2626; }
        .edit-message-body { padding: 1.1rem 1.25rem; display: flex; flex-direction: column; gap: .8rem; }
        .edit-message-body label { font-size: .85rem; font-weight: 600; color: var(--text-muted); }
        .edit-message-body textarea, .edit-message-body input {
            width: 100%; box-sizing: border-box; border: 1px solid var(--border);
            border-radius: .55rem; padding: .75rem; font: inherit; resize: vertical;
        }
        .edit-message-actions { display: flex; justify-content: flex-end; gap: .6rem; padding: 0 1.25rem 1.1rem; }
        .edit-message-actions button {
            border: 0; border-radius: .5rem; padding: .65rem 1rem; cursor: pointer; font-weight: 600;
        }
        .edit-message-actions .secondary { background: var(--bg); color: var(--text); }
        .edit-message-actions .primary { background: var(--primary); color: white; }
        .edit-message-actions button:disabled { opacity: .55; cursor: wait; }
        .input-area { flex-wrap: wrap; }
        .input-area #image-url-input { flex-basis: 100%; min-width: 0; }

        @media (max-width: 640px) {
            .sidebar { width: 42%; min-width: 145px; }
            .sidebar-header { padding: .9rem; flex-wrap: wrap; gap: .5rem; }
            .new-chat-btn { padding: .45rem .55rem; }
            .conv-item { padding: .8rem; gap: .5rem; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>💬 Maintenance Chat</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your JWT token to connect</p>
            <input type="text" id="token-input" placeholder="Bearer eyJhbGci..." />
            <button id="login-btn">Connect</button>
        </div>
    </div>

    <div id="new-chat-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="new-chat-title">
        <div class="modal-card">
            <div class="modal-heading">
                <h3 id="new-chat-title">Start a conversation</h3>
                <button id="close-new-chat-btn" class="icon-btn" type="button" aria-label="Close">×</button>
            </div>
            <input id="user-search-input" class="user-search" type="search" placeholder="Search users by name or email..." autocomplete="off" />
            <div id="user-search-status" class="modal-status">Type at least 2 characters to find people.</div>
            <div id="user-search-results" class="user-results"></div>
        </div>
    </div>

    <div id="message-context-menu" class="message-context-menu hidden" role="menu" aria-label="Message actions">
        <button id="context-edit-message" type="button" role="menuitem">✏️ Edit message</button>
        <button id="context-delete-message" class="danger" type="button" role="menuitem">🗑 Delete message</button>
    </div>

    <div id="edit-message-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="edit-message-title">
        <div class="modal-card">
            <div class="modal-heading">
                <h3 id="edit-message-title">Edit message</h3>
                <button id="close-edit-message-btn" class="icon-btn" type="button" aria-label="Close">×</button>
            </div>
            <div class="edit-message-body">
                <label for="edit-message-text">Message text</label>
                <textarea id="edit-message-text" rows="3" maxlength="10000" placeholder="Write a message (optional when images are attached)"></textarea>
                <label for="edit-message-images">Image URLs (one URL per line)</label>
                <textarea id="edit-message-images" rows="3" placeholder="https://.../image.jpg"></textarea>
                <small style="color:var(--text-muted)">Use URLs returned by Image Service. Up to 10 images. Leave text or at least one image.</small>
                <div id="edit-message-status" class="modal-status" style="padding:.2rem 0 0"></div>
            </div>
            <div class="edit-message-actions">
                <button id="cancel-edit-message-btn" class="secondary" type="button">Cancel</button>
                <button id="save-edit-message-btn" class="primary" type="button">Save changes</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>Conversations</span>
                <div class="sidebar-actions">
                    <button id="new-chat-btn" class="new-chat-btn" type="button" title="Start a new chat">+ New</button>
                    <button id="logout-btn" style="font-size: 0.7rem; cursor: pointer; border: none; background: none; color: var(--primary);">Logout</button>
                </div>
            </div>
            <div class="conv-list" id="conv-list">
                <!-- Conversations load here -->
            </div>
        </div>
        <div class="chat-area">
            <div id="no-chat-selected" style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
                Select a conversation to start chatting
            </div>
            <div id="active-chat" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="avatar" id="header-avatar">?</div>
                    <span id="header-name">Chat User</span>
                </div>
                <div class="messages-container" id="messages">
                    <!-- Messages load here -->
                </div>
                <div class="input-area">
                    <input type="text" id="msg-input" placeholder="Type a message..." />
                    <input type="url" id="image-url-input" placeholder="Image URL (optional, from Image Service)" aria-label="Image URL" />
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let currentToken = "";
        let currentChatId = null;
        let currentUserId = null;
        let activeHistoryRequestId = null;
        // Keep each outgoing message pending until the server confirms MongoDB persistence.
        const pendingMessageRequests = new Map();
        let currentMessages = [];
        let contextMessage = null;
        let longPressTimer = null;
        let suppressContextMenu = false;

        const elements = {
            loginOverlay: document.getElementById('login-overlay'),
            tokenInput: document.getElementById('token-input'),
            loginBtn: document.getElementById('login-btn'),
            convList: document.getElementById('conv-list'),
            activeChat: document.getElementById('active-chat'),
            noChat: document.getElementById('no-chat-selected'),
            msgInput: document.getElementById('msg-input'),
            sendBtn: document.getElementById('send-btn'),
            messages: document.getElementById('messages'),
            headerName: document.getElementById('header-name'),
            headerAvatar: document.getElementById('header-avatar'),
            logoutBtn: document.getElementById('logout-btn'),
            newChatBtn: document.getElementById('new-chat-btn'),
            newChatModal: document.getElementById('new-chat-modal'),
            closeNewChatBtn: document.getElementById('close-new-chat-btn'),
            userSearchInput: document.getElementById('user-search-input'),
            userSearchStatus: document.getElementById('user-search-status'),
            userSearchResults: document.getElementById('user-search-results'),
            imageUrlInput: document.getElementById('image-url-input'),
            messageContextMenu: document.getElementById('message-context-menu'),
            contextEditMessage: document.getElementById('context-edit-message'),
            contextDeleteMessage: document.getElementById('context-delete-message'),
            editMessageModal: document.getElementById('edit-message-modal'),
            editMessageText: document.getElementById('edit-message-text'),
            editMessageImages: document.getElementById('edit-message-images'),
            editMessageStatus: document.getElementById('edit-message-status'),
            saveEditMessageBtn: document.getElementById('save-edit-message-btn'),
            closeEditMessageBtn: document.getElementById('close-edit-message-btn'),
            cancelEditMessageBtn: document.getElementById('cancel-edit-message-btn')
        };

        // Utils
        const getWsUrl = () => {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host || 'localhost:7877';
            return `${protocol}//${host}/v1/ws/chat`;
        };

        function authorizationHeader() {
            const token = currentToken.trim();
            return /^Bearer\s/i.test(token) ? token : `Bearer ${token}`;
        }

        function getUserIdFromToken(token) {
            try {
                const rawToken = token.replace(/^Bearer\s+/i, '');
                const encodedPayload = rawToken.split('.')[1];
                if (!encodedPayload) return null;
                const base64 = encodedPayload.replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(atob(base64));
                return Number(payload.userId) || null;
            } catch (error) {
                console.warn('Could not read user ID from access token', error);
                return null;
            }
        }

        async function connect() {
            currentToken = elements.tokenInput.value.trim();
            if (!currentToken) return alert("Please enter a token");
            currentUserId = getUserIdFromToken(currentToken);
            if (currentUserId === null) {
                return alert("The token does not contain a valid userId. Please use a fresh access token.");
            }

            // We need an initial chat_id to connect.
            // In a real app, we might fetch the first conversation first via REST
            // For this demo, we'll try to connect and then the server handles session.
            // But our server requires chat_id. Let's fetch conversations first via REST to get one.

            try {
                const response = await fetch('/v1/conversations', {
                    headers: { 'Authorization': authorizationHeader() }
                });
                if (!response.ok) throw new Error("Unauthorized or no conversations found");

                const data = await response.json();
                if (data.items.length === 0) {
                    // Instead of alerting and returning, we'll let the user proceed
                    // and they can start a new chat if the UI supports it.
                    console.log("No conversations found, continuing to connect...");
                } else {
                    const initialChatId = data.items[0].conversation_id;
                    // Now connect WebSocket
                    socket = new WebSocket(`${getWsUrl()}?chat_id=${initialChatId}&token=${currentToken}`);
                }

                // If no initial chat was found, we still connect the socket
                // but without a chat_id. The server will need to handle this.
                if (!socket) {
                    socket = new WebSocket(`${getWsUrl()}?token=${currentToken}`);
                }

                // Since standard JS WebSockets don't support custom headers,
                // we usually send the token in the first message or via query param.
                // HOWEVER, our server checks headers.
                // In a real browser environment, you can't set WS headers.
                // We'll assume the server might allow token in query param or the
                // implementation uses a proxy.
                // FOR THIS DEMO: We will simulate the auth by sending a custom event first
                // if the server was modified to support it, but our server uses headers.
                // To make this WORK in a browser, I'll suggest the user uses a tool like Postman
                // or I can modify the server to accept a token in the query string.

                socket.onopen = () => {
                    console.log("Connected to WS");
                    elements.loginOverlay.classList.add('hidden');
                    loadConversations();
                };

                socket.onmessage = (event) => {
                    if (typeof event.data === 'string') {
                        handleTextMessage(JSON.parse(event.data));
                    } else {
                        console.log("Binary frame received (likely PONG/PING)");
                    }
                };

                socket.onclose = () => {
                    alert("Disconnected from server");
                    elements.loginOverlay.classList.remove('hidden');
                };

                // Heartbeat: Respond to PING (binary 0x01) with PONG (binary 0x02)
                socket.onmessage = async (event) => {
                    if (event.data instanceof Blob) {
                        const buffer = await event.data.arrayBuffer();
                        const view = new Uint8Array(buffer);
                        if (view[0] === 1) { // PING
                            socket.send(new Uint8Array([2])); // PONG
                        }
                    } else {
                        handleTextMessage(JSON.parse(event.data));
                    }
                };

            } catch (e) {
                alert("Login failed: " + e.message);
            }
        }

        function handleTextMessage(data) {
            const { type, payload, request_id } = data;

            switch(type) {
                case 'CONVERSATIONS_LIST':
                    renderConversations(payload);
                    break;
                case 'CONVERSATION_OPENED':
                    elements.noChat.classList.add('hidden');
                    elements.activeChat.classList.remove('hidden');
                    break;
                case 'MESSAGES_PAGE':
                    // Ignore delayed history responses from a previously selected chat.
                    // Otherwise a fast click between chats can replace the visible history
                    // with a response that belongs to the previous selection.
                    if (request_id === activeHistoryRequestId) {
                        renderMessages(Array.isArray(payload?.items) ? payload.items : []);
                    }
                    break;
                case 'MESSAGE':
                    // A websocket can deliver messages from a chat that is no longer
                    // selected. Never append those messages to the currently visible chat.
                    if (String(payload?.conversation_id) !== String(currentChatId)) break;
                    // The sender already receives MESSAGE_SENT as its acknowledgement.
                    // Ignore its broadcast copy to avoid duplicate own messages.
                    if (Number(payload?.who_sent) !== Number(currentUserId)) {
                        appendMessage(payload, 'received');
                        loadConversations();
                    }
                    break;
                case 'MESSAGE_SENT': {
                    // The server emits MESSAGE_SENT only after the MongoDB write succeeds.
                    const pending = pendingMessageRequests.get(request_id);
                    if (!pending) break; // Ignore duplicate or unknown acknowledgements.
                    pendingMessageRequests.delete(request_id);

                    if (String(payload?.conversation_id) === String(pending.conversationId)) {
                        if (String(payload?.conversation_id) === String(currentChatId)) {
                            appendMessage(payload, 'sent');
                        }
                        // Clear only if the user hasn't edited the composer while waiting.
                        if (elements.msgInput.value.trim() === pending.text) {
                            elements.msgInput.value = "";
                        }
                        if (elements.imageUrlInput.value.trim() === (pending.images?.[0] || "")) {
                            elements.imageUrlInput.value = "";
                        }
                        loadConversations();
                    }
                    break;
                }
                case 'message.updated':
                case 'MESSAGE_UPDATED': {
                    if (String(payload?.conversation_id) === String(currentChatId)) {
                        applyMessageUpdate(payload);
                    }
                    break;
                }
                case 'message.deleted':
                case 'MESSAGE_DELETED': {
                    if (String(payload?.conversation_id) === String(currentChatId)) {
                        applyMessageDelete(payload);
                    }
                    break;
                }
                case 'ERROR':
                    if (request_id && pendingMessageRequests.has(request_id)) {
                        // Keep the draft in the input so a failed write doesn't look successful.
                        pendingMessageRequests.delete(request_id);
                        alert("Xabar saqlanmadi. Matnni yo'qotmadingiz, qayta yuborishingiz mumkin.");
                    }
                    console.error("Server Error:", payload?.message || "Unknown error");
                    break;
            }
        }

        async function loadConversations() {
            socket.send(JSON.stringify({
                type: "LIST_CONVERSATIONS",
                request_id: "req_list",
                payload: { page: 1, size: 20 }
            }));
        }

        async function renderConversations(data) {
            elements.convList.innerHTML = "";
            const receivedConversations = Array.isArray(data?.items) ? data.items : [];

            // Defensive frontend deduplication: a direct chat is identified by its
            // two participant IDs, not by the stored name or conversation ID.
            // Prefer the deterministic ID and then the most recently active record.
            const conversationsByPair = new Map();
            receivedConversations
                .filter(conv => Array.isArray(conv.people) && conv.people.length === 2)
                .sort((a, b) => {
                    const aCanonical = String(a.conversation_id || '').startsWith('direct-') ? 1 : 0;
                    const bCanonical = String(b.conversation_id || '').startsWith('direct-') ? 1 : 0;
                    if (aCanonical !== bCanonical) return bCanonical - aCanonical;
                    return new Date(b.updated_at || 0).getTime() - new Date(a.updated_at || 0).getTime();
                })
                .forEach(conv => {
                    const pair = conv.people.map(Number).sort((a, b) => a - b);
                    if (pair.some(id => !Number.isFinite(id))) return;
                    const key = pair.join(':');
                    if (!conversationsByPair.has(key)) conversationsByPair.set(key, conv);
                });
            const conversations = Array.from(conversationsByPair.values());

            if (conversations.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'padding:1.25rem;color:var(--text-muted);font-size:.9rem;line-height:1.5;';
                empty.textContent = 'No conversations yet. Click “+ New” to find someone and start chatting.';
                elements.convList.appendChild(empty);
                return;
            }

            for (const conv of conversations) {
                // A direct conversation's stored name reflects whoever created it.
                // Resolve the other participant for the currently authenticated user.
                const otherUserId = Array.isArray(conv.people)
                    ? conv.people.find(id => Number(id) !== Number(currentUserId))
                    : null;
                // Conversation.name is shared by both participants, so it cannot
                // reliably identify the other person. Derive the label from people[].
                let displayName = otherUserId != null ? `User ${otherUserId}` : 'Conversation';
                conv.phoneNumber = null;
                if (otherUserId != null && currentToken) {
                    try {
                        const profileResponse = await fetch(
                            `/user-service/v1/user/${encodeURIComponent(otherUserId)}`,
                            { headers: { 'Authorization': authorizationHeader() } }
                        );
                        if (profileResponse.ok) {
                            const profileBody = await profileResponse.json();
                            const profile = profileBody?.data || profileBody;
                            const profileId = profile?.id ?? profile?.userId ?? profile?.user_id;
                            // Only accept the profile if it belongs to the expected peer.
                            // Never display the logged-in user's profile as the chat peer.
                            if (profile && (profileId == null || Number(profileId) === Number(otherUserId))) {
                                displayName = profile.fullName || profile.name || profile.phoneNumber || displayName;
                                conv.phoneNumber = profile.phoneNumber || null;
                            }
                        }
                    } catch (error) {
                        console.warn('Could not resolve conversation participant', error);
                    }
                }
                conv.name = displayName;

                const div = document.createElement('div');
                div.className = 'conv-item';
                div.dataset.conversationId = conv.conversation_id;

                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                if (conv.profile_image) {
                    const img = document.createElement('img');
                    img.src = conv.profile_image;
                    img.alt = '';
                    avatar.appendChild(img);
                } else {
                    avatar.textContent = displayName.charAt(0).toUpperCase();
                }

                const details = document.createElement('div');
                details.style.cssText = 'flex:1;min-width:0;display:flex;flex-direction:column;gap:.2rem;';
                const name = document.createElement('div');
                name.style.cssText = 'font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                name.textContent = displayName;
                details.appendChild(name);
                if (conv.phoneNumber) {
                    const phone = document.createElement('div');
                    phone.style.cssText = 'font-size:.8rem;color:var(--text-muted);';
                    phone.textContent = conv.phoneNumber;
                    details.appendChild(phone);
                }

                div.append(avatar, details);
                if (conv.conversation_id === currentChatId) div.classList.add('active');
                div.onclick = () => openConversation(conv);
                elements.convList.appendChild(div);
            }
        }

        async function openConversation(conv) {
            currentChatId = conv.conversation_id;
            const displayName = conv.name || 'Conversation';
            elements.headerName.textContent = displayName;
            elements.headerAvatar.textContent = displayName.charAt(0).toUpperCase();
            elements.messages.innerHTML = '';
            document.querySelectorAll('.conv-item').forEach(el => {
                el.classList.toggle('active', el.dataset.conversationId === currentChatId);
            });

            // 1. Open conversation context
            socket.send(JSON.stringify({
                type: "OPEN_CONVERSATION",
                request_id: "req_open",
                payload: { chat_id: conv.conversation_id }
            }));

            // 2. Load history
            activeHistoryRequestId = `history-${currentChatId}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
            socket.send(JSON.stringify({
                type: "GET_HISTORY",
                request_id: activeHistoryRequestId,
                payload: { page: 1, size: 50 }
            }));

            // Keep the selected conversation highlighted.
            document.querySelectorAll('.conv-item').forEach(el => {
                el.classList.toggle('active', el.dataset.conversationId === currentChatId);
            });
        }

        function renderMessages(messages) {
            currentMessages = Array.isArray(messages) ? messages.slice() : [];
            elements.messages.innerHTML = "";
            currentMessages.forEach(msg => renderMessageNode(
                msg,
                Number(msg.who_sent) === Number(currentUserId) ? 'sent' : 'received'
            ));
        }

        function appendMessage(msg, type) {
            const id = messageId(msg);
            if (id && currentMessages.some(existing => messageId(existing) === id)) return;
            currentMessages.push(msg);
            renderMessageNode(msg, type);
        }

        function messageId(msg) {
            return String(msg?.room_id ?? msg?._id ?? msg?.message_id ?? '');
        }

        function renderMessageNode(msg, type) {
            const div = document.createElement('div');
            const deleted = Boolean(msg.is_deleted);
            div.className = `message ${type}${deleted ? ' deleted' : ''}`;
            div.dataset.messageId = messageId(msg);
            div.dataset.conversationId = String(msg.conversation_id || currentChatId || '');

            if (deleted) {
                const deletedText = document.createElement('div');
                deletedText.textContent = 'This message was deleted';
                div.appendChild(deletedText);
            } else {
                const textNode = document.createElement('div');
                textNode.textContent = typeof msg.text === 'string' ? msg.text : '';
                div.appendChild(textNode);

                if (Array.isArray(msg.images) && msg.images.length) {
                    const images = document.createElement('div');
                    images.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;';
                    msg.images.forEach(src => {
                        if (typeof src !== 'string' || !/^https?:\/\//i.test(src)) return;
                        const img = document.createElement('img');
                        img.src = src;
                        img.alt = 'Message attachment';
                        img.loading = 'lazy';
                        img.style.cssText = 'max-width:180px;max-height:180px;border-radius:6px;object-fit:cover;';
                        img.onerror = () => img.remove();
                        images.appendChild(img);
                    });
                    if (images.childElementCount) div.appendChild(images);
                }
            }

            const meta = document.createElement('div');
            meta.className = 'message-meta';
            const time = msg.created_at ? new Date(msg.created_at) : new Date();
            meta.textContent = `${Number(msg.who_sent) === Number(currentUserId) ? 'You' : 'Message'} · ${time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}${msg.is_edited && !deleted ? ' · edited' : ''}`;
            div.appendChild(meta);

            if (!deleted && Number(msg.who_sent) === Number(currentUserId) && messageId(msg)) {
                div.addEventListener('contextmenu', event => {
                    event.preventDefault();
                    showMessageMenu(msg, event.clientX, event.clientY);
                });
                div.addEventListener('pointerdown', event => {
                    if (event.pointerType !== 'touch') return;
                    longPressTimer = setTimeout(() => {
                        suppressContextMenu = true;
                        showMessageMenu(msg, event.clientX, event.clientY);
                    }, 550);
                });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(name => {
                    div.addEventListener(name, () => {
                        if (longPressTimer) clearTimeout(longPressTimer);
                        longPressTimer = null;
                    });
                });
                div.addEventListener('click', event => {
                    if (suppressContextMenu) {
                        event.preventDefault();
                        event.stopPropagation();
                        suppressContextMenu = false;
                    }
                });
            }

            elements.messages.appendChild(div);
            elements.messages.scrollTop = elements.messages.scrollHeight;
        }

        function showMessageMenu(message, x, y) {
            contextMessage = message;
            const menu = elements.messageContextMenu;
            menu.classList.remove('hidden');
            const width = menu.offsetWidth || 170;
            const height = menu.offsetHeight || 100;
            menu.style.left = `${Math.max(8, Math.min(x, window.innerWidth - width - 8))}px`;
            menu.style.top = `${Math.max(8, Math.min(y, window.innerHeight - height - 8))}px`;
        }

        function hideMessageMenu() {
            elements.messageContextMenu.classList.add('hidden');
            contextMessage = null;
        }

        function openEditMessage() {
            const message = contextMessage;
            hideMessageMenu();
            if (!message || Number(message.who_sent) !== Number(currentUserId)) return;
            elements.editMessageText.value = message.text || '';
            elements.editMessageImages.value = Array.isArray(message.images) ? message.images.join('\n') : '';
            elements.editMessageStatus.textContent = '';
            elements.saveEditMessageBtn.disabled = false;
            elements.editMessageModal.classList.remove('hidden');
            elements.editMessageText.focus();
            contextMessage = message;
        }

        function closeEditMessage() {
            elements.editMessageModal.classList.add('hidden');
            contextMessage = null;
            elements.saveEditMessageBtn.disabled = false;
            elements.editMessageStatus.textContent = '';
        }

        async function saveEditMessage() {
            const message = contextMessage;
            if (!message || !messageId(message)) return;
            const text = elements.editMessageText.value.trim();
            const images = elements.editMessageImages.value
                .split('\n').map(url => url.trim()).filter(Boolean);

            if (!text && images.length === 0) {
                elements.editMessageStatus.textContent = 'Enter text or at least one image URL.';
                return;
            }
            if (images.length > 10 || images.some(url => !/^https?:\/\//i.test(url))) {
                elements.editMessageStatus.textContent = 'Use up to 10 absolute HTTP/HTTPS image URLs.';
                return;
            }

            elements.saveEditMessageBtn.disabled = true;
            elements.editMessageStatus.textContent = 'Saving…';
            try {
                const response = await fetch(`/v1/messages/${encodeURIComponent(messageId(message))}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': authorizationHeader(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text, images })
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(body.detail || `Edit failed (${response.status})`);
                applyMessageUpdate(body);
                closeEditMessage();
            } catch (error) {
                elements.editMessageStatus.textContent = error.message || 'Could not save message.';
                elements.saveEditMessageBtn.disabled = false;
            }
        }

        async function deleteContextMessage() {
            const message = contextMessage;
            hideMessageMenu();
            if (!message || !messageId(message)) return;
            if (!confirm('Delete this message for everyone?')) return;

            try {
                const response = await fetch(`/v1/messages/${encodeURIComponent(messageId(message))}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': authorizationHeader() }
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(body.detail || `Delete failed (${response.status})`);
                applyMessageDelete(body);
            } catch (error) {
                alert(error.message || 'Could not delete message.');
            }
        }

        function applyMessageUpdate(updated) {
            const id = messageId(updated);
            if (!id) return;
            currentMessages = currentMessages.map(message =>
                messageId(message) === id
                    ? { ...message, ...updated, room_id: id }
                    : message
            );
            renderMessages(currentMessages);
        }

        function applyMessageDelete(deleted) {
            const id = messageId(deleted);
            if (!id) return;
            currentMessages = currentMessages.map(message =>
                messageId(message) === id
                    ? { ...message, ...deleted, room_id: id, text: null, images: [], is_deleted: true }
                    : message
            );
            renderMessages(currentMessages);
        }

        function sendMessage() {
            const text = elements.msgInput.value.trim();
            const imageUrl = elements.imageUrlInput.value.trim();
            const images = imageUrl ? [imageUrl] : [];
            if ((!text && images.length === 0) || !socket || socket.readyState !== WebSocket.OPEN || !currentChatId) return;
            if (images.some(url => !/^https?:\/\//i.test(url))) {
                alert('Image URL must start with http:// or https://');
                return;
            }

            const requestId = `send-${Date.now()}-${Math.random().toString(36).slice(2)}`;
            pendingMessageRequests.set(requestId, { text, images, conversationId: currentChatId });

            try {
                socket.send(JSON.stringify({
                    type: "SEND_MESSAGE",
                    request_id: requestId,
                    payload: { text: text || null, images }
                }));
                // Keep both drafts until the server acknowledges MongoDB persistence.
            } catch (error) {
                pendingMessageRequests.delete(requestId);
                console.error("Message could not be sent:", error);
                alert("Xabar yuborilmadi. Matn va rasm URL'i saqlandi, qayta urinib ko'ring.");
            }
        }

        let userSearchTimeout = null;

        function openNewChatModal() {
            elements.newChatModal.classList.remove('hidden');
            elements.userSearchInput.value = '';
            elements.userSearchResults.innerHTML = '';
            elements.userSearchStatus.textContent = 'Type at least 2 characters to find people.';
            elements.userSearchInput.focus();
        }

        function closeNewChatModal() {
            elements.newChatModal.classList.add('hidden');
        }

        async function searchUsers() {
            const query = elements.userSearchInput.value.trim();
            elements.userSearchResults.innerHTML = '';

            if (query.length < 2) {
                elements.userSearchStatus.textContent = 'Type at least 2 characters to find people.';
                return;
            }

            elements.userSearchStatus.textContent = 'Searching...';
            try {
                const response = await fetch(`/v1/users/search?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': authorizationHeader() }
                });
                if (!response.ok) throw new Error(`Search failed (${response.status})`);
                const result = await response.json();
                const users = Array.isArray(result) ? result : result.data;

                elements.userSearchResults.innerHTML = '';
                if (!Array.isArray(users) || users.length === 0) {
                    elements.userSearchStatus.textContent = 'No users found.';
                    return;
                }

                elements.userSearchStatus.textContent = `Found ${users.length} user(s). Select one to start chatting.`;
                users.filter(user => {
                    const candidateId = user.userId ?? user.id;
                    return candidateId != null && Number(candidateId) !== Number(currentUserId);
                }).forEach(user => {
                    const targetUserId = user.userId ?? user.id;
                    const displayUserName = user.name || user.fullName || `User ${targetUserId}`;
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'user-result';

                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    if (user.avatar) {
                        const img = document.createElement('img');
                        img.src = user.avatar;
                        img.alt = '';
                        avatar.appendChild(img);
                    } else {
                        avatar.textContent = displayUserName.charAt(0).toUpperCase();
                    }

                    const name = document.createElement('span');
                    name.className = 'user-name';
                    name.textContent = user.phoneNumber
                        ? `${displayUserName} · ${user.phoneNumber}`
                        : displayUserName;

                    const action = document.createElement('span');
                    action.className = 'start-label';
                    action.textContent = 'Chat →';

                    button.append(avatar, name, action);
                    button.onclick = () => createConversationWith({ ...user, userId: targetUserId, name: displayUserName }, button);
                    elements.userSearchResults.appendChild(button);
                });
            } catch (error) {
                elements.userSearchStatus.textContent = error.message || 'Could not search users.';
            }
        }

        async function createConversationWith(user, button) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                elements.userSearchStatus.textContent = 'Chat connection is not ready. Please reconnect.';
                return;
            }

            button.disabled = true;
            elements.userSearchStatus.textContent = 'Creating conversation...';
            try {
                const response = await fetch(`/v1/conversations?userId=${encodeURIComponent(user.userId)}`, {
                    method: 'POST',
                    headers: { 'Authorization': authorizationHeader() }
                });
                const body = await response.json();
                if (!response.ok) {
                    throw new Error(body.detail || `Could not create conversation (${response.status})`);
                }

                // The server stores a conversation-level display name. Use the selected
                // user's current profile for this view so the new chat opens immediately.
                // Keep the selected participant's name only in this UI instance.
                // The backend's shared conversation record must not define both users'
                // display names.
                body.name = user.name || body.name || 'New Chat';
                body.profile_image = user.avatar || body.profile_image || null;
                closeNewChatModal();
                loadConversations();
                await openConversation(body);
            } catch (error) {
                elements.userSearchStatus.textContent = error.message || 'Could not create conversation.';
                button.disabled = false;
            }
        }

        elements.contextEditMessage.onclick = openEditMessage;
        elements.contextDeleteMessage.onclick = deleteContextMessage;
        elements.saveEditMessageBtn.onclick = saveEditMessage;
        elements.closeEditMessageBtn.onclick = closeEditMessage;
        elements.cancelEditMessageBtn.onclick = closeEditMessage;
        elements.editMessageModal.onclick = event => {
            if (event.target === elements.editMessageModal) closeEditMessage();
        };
        document.addEventListener('click', event => {
            if (!elements.messageContextMenu.contains(event.target)) hideMessageMenu();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                hideMessageMenu();
                closeEditMessage();
            }
        });

        elements.newChatBtn.onclick = openNewChatModal;
        elements.closeNewChatBtn.onclick = closeNewChatModal;
        elements.newChatModal.onclick = (event) => {
            if (event.target === elements.newChatModal) closeNewChatModal();
        };
        elements.userSearchInput.oninput = () => {
            clearTimeout(userSearchTimeout);
            userSearchTimeout = setTimeout(searchUsers, 250);
        };
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeNewChatModal();
        });

        elements.loginBtn.onclick = connect;
        elements.sendBtn.onclick = sendMessage;
        elements.msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
        elements.imageUrlInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
        elements.logoutBtn.onclick = () => { location.reload(); };

    </script>
</body>
</html>
