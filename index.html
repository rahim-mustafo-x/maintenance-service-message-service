<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Chat</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f3f4f6;
            --sidebar-bg: #ffffff;
            --chat-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #dbeafe;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Login Overlay */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 { margin-top: 0; color: var(--primary); }
        .login-card input {
            width: 100%;
            padding: 0.75rem;
            margin: 1rem 0;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            box-sizing: border-box;
        }
        .login-card button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conv-list {
            flex: 1;
            overflow-y: auto;
        }
        .conv-item {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .conv-item:hover { background: var(--bg); }
        .conv-item.active { background: var(--accent); border-left: 4px solid var(--primary); }
        .avatar {
            width: 40px;
            height: 40px;
            background: #cbd5e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
        }
        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
        }
        .messages-container {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #f9fafb;
        }
        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }
        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0.2rem;
        }
        .message.received {
            align-self: flex-start;
            background: #e5e7eb;
            color: var(--text);
            border-bottom-left-radius: 0.2rem;
        }
        .message-meta {
            font-size: 0.7rem;
            margin-top: 0.25rem;
            opacity: 0.8;
            text-align: right;
        }

        .input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            background: white;
        }
        .input-area input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
        }
        .input-area button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }
        .hidden { display: none !important; }

        .sidebar-actions { display: flex; align-items: center; gap: 0.75rem; }
        .new-chat-btn {
            border: 0; border-radius: 0.5rem; padding: 0.55rem 0.75rem;
            background: var(--primary); color: white; font-weight: 600; cursor: pointer;
        }
        .modal-overlay {
            position: fixed; inset: 0; z-index: 900; display: flex;
            align-items: center; justify-content: center; padding: 1rem;
            background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px);
        }
        .modal-card {
            width: 100%; max-width: 440px; max-height: 80vh; overflow: hidden;
            background: white; border-radius: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,.2);
            display: flex; flex-direction: column;
        }
        .modal-heading {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border);
        }
        .modal-heading h3 { margin: 0; }
        .icon-btn { border: 0; background: transparent; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }
        .user-search { margin: 1rem 1.25rem 0; padding: .8rem; border: 1px solid var(--border); border-radius: .5rem; font: inherit; }
        .user-results { overflow-y: auto; padding: .5rem .75rem 1rem; }
        .user-result {
            width: 100%; display: flex; align-items: center; gap: .75rem;
            padding: .75rem; border: 0; border-radius: .6rem; background: white;
            text-align: left; cursor: pointer; color: var(--text);
        }
        .user-result:hover { background: var(--bg); }
        .user-result .user-name { flex: 1; font-weight: 600; }
        .user-result .start-label { color: var(--primary); font-size: .85rem; }
        .modal-status { padding: .5rem 1.25rem 1rem; color: var(--text-muted); font-size: .9rem; }
        @media (max-width: 640px) {
            .sidebar { width: 42%; min-width: 145px; }
            .sidebar-header { padding: .9rem; flex-wrap: wrap; gap: .5rem; }
            .new-chat-btn { padding: .45rem .55rem; }
            .conv-item { padding: .8rem; gap: .5rem; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>💬 Maintenance Chat</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your JWT token to connect</p>
            <input type="text" id="token-input" placeholder="Bearer eyJhbGci..." />
            <button id="login-btn">Connect</button>
        </div>
    </div>

    <div id="new-chat-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="new-chat-title">
        <div class="modal-card">
            <div class="modal-heading">
                <h3 id="new-chat-title">Start a conversation</h3>
                <button id="close-new-chat-btn" class="icon-btn" type="button" aria-label="Close">×</button>
            </div>
            <input id="user-search-input" class="user-search" type="search" placeholder="Search users by name or email..." autocomplete="off" />
            <div id="user-search-status" class="modal-status">Type at least 2 characters to find people.</div>
            <div id="user-search-results" class="user-results"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>Conversations</span>
                <div class="sidebar-actions">
                    <button id="new-chat-btn" class="new-chat-btn" type="button" title="Start a new chat">+ New</button>
                    <button id="logout-btn" style="font-size: 0.7rem; cursor: pointer; border: none; background: none; color: var(--primary);">Logout</button>
                </div>
            </div>
            <div class="conv-list" id="conv-list">
                <!-- Conversations load here -->
            </div>
        </div>
        <div class="chat-area">
            <div id="no-chat-selected" style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
                Select a conversation to start chatting
            </div>
            <div id="active-chat" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="avatar" id="header-avatar">?</div>
                    <span id="header-name">Chat User</span>
                </div>
                <div class="messages-container" id="messages">
                    <!-- Messages load here -->
                </div>
                <div class="input-area">
                    <input type="text" id="msg-input" placeholder="Type a message..." />
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let currentToken = "";
        let currentChatId = null;
        let currentUserId = null;

        const elements = {
            loginOverlay: document.getElementById('login-overlay'),
            tokenInput: document.getElementById('token-input'),
            loginBtn: document.getElementById('login-btn'),
            convList: document.getElementById('conv-list'),
            activeChat: document.getElementById('active-chat'),
            noChat: document.getElementById('no-chat-selected'),
            msgInput: document.getElementById('msg-input'),
            sendBtn: document.getElementById('send-btn'),
            messages: document.getElementById('messages'),
            headerName: document.getElementById('header-name'),
            headerAvatar: document.getElementById('header-avatar'),
            logoutBtn: document.getElementById('logout-btn'),
            newChatBtn: document.getElementById('new-chat-btn'),
            newChatModal: document.getElementById('new-chat-modal'),
            closeNewChatBtn: document.getElementById('close-new-chat-btn'),
            userSearchInput: document.getElementById('user-search-input'),
            userSearchStatus: document.getElementById('user-search-status'),
            userSearchResults: document.getElementById('user-search-results')
        };

        // Utils
        const getWsUrl = () => {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host || 'localhost:7877';
            return `${protocol}//${host}/v1/ws/chat`;
        };

        function authorizationHeader() {
            const token = currentToken.trim();
            return /^Bearer\s/i.test(token) ? token : `Bearer ${token}`;
        }

        function getUserIdFromToken(token) {
            try {
                const rawToken = token.replace(/^Bearer\s+/i, '');
                const encodedPayload = rawToken.split('.')[1];
                if (!encodedPayload) return null;
                const base64 = encodedPayload.replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(atob(base64));
                return Number(payload.userId) || null;
            } catch (error) {
                console.warn('Could not read user ID from access token', error);
                return null;
            }
        }

        async function connect() {
            currentToken = elements.tokenInput.value.trim();
            if (!currentToken) return alert("Please enter a token");
            currentUserId = getUserIdFromToken(currentToken);
            if (currentUserId === null) {
                return alert("The token does not contain a valid userId. Please use a fresh access token.");
            }

            // We need an initial chat_id to connect.
            // In a real app, we might fetch the first conversation first via REST
            // For this demo, we'll try to connect and then the server handles session.
            // But our server requires chat_id. Let's fetch conversations first via REST to get one.

            try {
                const response = await fetch('/v1/conversations', {
                    headers: { 'Authorization': authorizationHeader() }
                });
                if (!response.ok) throw new Error("Unauthorized or no conversations found");

                const data = await response.json();
                if (data.items.length === 0) {
                    // Instead of alerting and returning, we'll let the user proceed
                    // and they can start a new chat if the UI supports it.
                    console.log("No conversations found, continuing to connect...");
                } else {
                    const initialChatId = data.items[0].conversation_id;
                    // Now connect WebSocket
                    socket = new WebSocket(`${getWsUrl()}?chat_id=${initialChatId}&token=${currentToken}`);
                }

                // If no initial chat was found, we still connect the socket
                // but without a chat_id. The server will need to handle this.
                if (!socket) {
                    socket = new WebSocket(`${getWsUrl()}?token=${currentToken}`);
                }

                // Since standard JS WebSockets don't support custom headers,
                // we usually send the token in the first message or via query param.
                // HOWEVER, our server checks headers.
                // In a real browser environment, you can't set WS headers.
                // We'll assume the server might allow token in query param or the
                // implementation uses a proxy.
                // FOR THIS DEMO: We will simulate the auth by sending a custom event first
                // if the server was modified to support it, but our server uses headers.
                // To make this WORK in a browser, I'll suggest the user uses a tool like Postman
                // or I can modify the server to accept a token in the query string.

                socket.onopen = () => {
                    console.log("Connected to WS");
                    elements.loginOverlay.classList.add('hidden');
                    loadConversations();
                };

                socket.onmessage = (event) => {
                    if (typeof event.data === 'string') {
                        handleTextMessage(JSON.parse(event.data));
                    } else {
                        console.log("Binary frame received (likely PONG/PING)");
                    }
                };

                socket.onclose = () => {
                    alert("Disconnected from server");
                    elements.loginOverlay.classList.remove('hidden');
                };

                // Heartbeat: Respond to PING (binary 0x01) with PONG (binary 0x02)
                socket.onmessage = async (event) => {
                    if (event.data instanceof Blob) {
                        const buffer = await event.data.arrayBuffer();
                        const view = new Uint8Array(buffer);
                        if (view[0] === 1) { // PING
                            socket.send(new Uint8Array([2])); // PONG
                        }
                    } else {
                        handleTextMessage(JSON.parse(event.data));
                    }
                };

            } catch (e) {
                alert("Login failed: " + e.message);
            }
        }

        function handleTextMessage(data) {
            const { type, payload, request_id } = data;

            switch(type) {
                case 'CONVERSATIONS_LIST':
                    renderConversations(payload);
                    break;
                case 'CONVERSATION_OPENED':
                    elements.noChat.classList.add('hidden');
                    elements.activeChat.classList.remove('hidden');
                    break;
                case 'MESSAGES_PAGE':
                    renderMessages(payload.items);
                    break;
                case 'MESSAGE':
                    // The sender already receives MESSAGE_SENT as its acknowledgement.
                    // Ignore its broadcast copy to avoid duplicate own messages.
                    if (Number(payload?.who_sent) !== Number(currentUserId)) {
                        appendMessage(payload, 'received');
                        loadConversations();
                    }
                    break;
                case 'MESSAGE_SENT':
                    appendMessage(payload, 'sent');
                    loadConversations();
                    break;
                case 'ERROR':
                    console.error("Server Error:", payload.message);
                    break;
            }
        }

        async function loadConversations() {
            socket.send(JSON.stringify({
                type: "LIST_CONVERSATIONS",
                request_id: "req_list",
                payload: { page: 1, size: 20 }
            }));
        }

        async function renderConversations(data) {
            elements.convList.innerHTML = "";
            const conversations = Array.isArray(data?.items) ? data.items : [];

            if (conversations.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'padding:1.25rem;color:var(--text-muted);font-size:.9rem;line-height:1.5;';
                empty.textContent = 'No conversations yet. Click “+ New” to find someone and start chatting.';
                elements.convList.appendChild(empty);
                return;
            }

            for (const conv of conversations) {
                // A direct conversation's stored name reflects whoever created it.
                // Resolve the other participant for the currently authenticated user.
                const otherUserId = Array.isArray(conv.people)
                    ? conv.people.find(id => Number(id) !== Number(currentUserId))
                    : null;
                let displayName = conv.name || 'Conversation';
                if (otherUserId != null && currentToken) {
                    try {
                        const profileResponse = await fetch(
                            `/user-service/v1/user/${encodeURIComponent(otherUserId)}`,
                            { headers: { 'Authorization': authorizationHeader() } }
                        );
                        if (profileResponse.ok) {
                            const profileBody = await profileResponse.json();
                            const profile = profileBody.data || profileBody;
                            displayName = profile.fullName || profile.phoneNumber || displayName;
                            conv.phoneNumber = profile.phoneNumber || null;
                            conv.name = displayName;
                        }
                    } catch (error) {
                        console.warn('Could not resolve conversation participant', error);
                    }
                }

                const div = document.createElement('div');
                div.className = 'conv-item';
                div.dataset.conversationId = conv.conversation_id;

                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                if (conv.profile_image) {
                    const img = document.createElement('img');
                    img.src = conv.profile_image;
                    img.alt = '';
                    avatar.appendChild(img);
                } else {
                    avatar.textContent = displayName.charAt(0).toUpperCase();
                }

                const details = document.createElement('div');
                details.style.cssText = 'flex:1;min-width:0;display:flex;flex-direction:column;gap:.2rem;';
                const name = document.createElement('div');
                name.style.cssText = 'font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                name.textContent = displayName;
                details.appendChild(name);
                if (conv.phoneNumber) {
                    const phone = document.createElement('div');
                    phone.style.cssText = 'font-size:.8rem;color:var(--text-muted);';
                    phone.textContent = conv.phoneNumber;
                    details.appendChild(phone);
                }

                div.append(avatar, details);
                if (conv.conversation_id === currentChatId) div.classList.add('active');
                div.onclick = () => openConversation(conv);
                elements.convList.appendChild(div);
            }
        }

        async function openConversation(conv) {
            currentChatId = conv.conversation_id;
            const displayName = conv.name || 'Conversation';
            elements.headerName.textContent = displayName;
            elements.headerAvatar.textContent = displayName.charAt(0).toUpperCase();
            elements.messages.innerHTML = '';

            // 1. Open conversation context
            socket.send(JSON.stringify({
                type: "OPEN_CONVERSATION",
                request_id: "req_open",
                payload: { chat_id: conv.conversation_id }
            }));

            // 2. Load history
            socket.send(JSON.stringify({
                type: "GET_HISTORY",
                request_id: "req_hist",
                payload: { page: 1, size: 50 }
            }));

            // Update active UI
            document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
            // (Logic to mark active would go here)
        }

        function renderMessages(messages) {
            elements.messages.innerHTML = "";
            messages.forEach(msg => {
                appendMessage(msg, Number(msg.who_sent) === Number(currentUserId) ? 'sent' : 'received');
            });
        }

        function appendMessage(msg, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;

            let messageText = typeof msg.text === 'string' ? msg.text : '';
            // Be tolerant of messages produced by the old double-encoded broadcast.
            try {
                const parsed = JSON.parse(messageText);
                if (parsed && typeof parsed === 'object') {
                    messageText = typeof parsed.text === 'string' ? parsed.text : messageText;
                }
            } catch (_) {
                // Normal user-entered text is not JSON.
            }

            const textNode = document.createElement('div');
            textNode.textContent = messageText;
            div.appendChild(textNode);

            if (Array.isArray(msg.images) && msg.images.length) {
                const images = document.createElement('div');
                images.style.cssText = 'display:flex;gap:5px;margin-top:5px;';
                msg.images.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = 'Message attachment';
                    img.style.cssText = 'width:100px;border-radius:4px;object-fit:cover;';
                    images.appendChild(img);
                });
                div.appendChild(images);
            }

            const meta = document.createElement('div');
            meta.className = 'message-meta';
            meta.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            div.appendChild(meta);

            elements.messages.appendChild(div);
            elements.messages.scrollTop = elements.messages.scrollHeight;
        }

        function sendMessage() {
            const text = elements.msgInput.value.trim();
            if (!text || !socket || !currentChatId) return;

            socket.send(JSON.stringify({
                type: "SEND_MESSAGE",
                request_id: "req_send",
                payload: { text: text, images: [] }
            }));

            elements.msgInput.value = "";
        }

        let userSearchTimeout = null;

        function openNewChatModal() {
            elements.newChatModal.classList.remove('hidden');
            elements.userSearchInput.value = '';
            elements.userSearchResults.innerHTML = '';
            elements.userSearchStatus.textContent = 'Type at least 2 characters to find people.';
            elements.userSearchInput.focus();
        }

        function closeNewChatModal() {
            elements.newChatModal.classList.add('hidden');
        }

        async function searchUsers() {
            const query = elements.userSearchInput.value.trim();
            elements.userSearchResults.innerHTML = '';

            if (query.length < 2) {
                elements.userSearchStatus.textContent = 'Type at least 2 characters to find people.';
                return;
            }

            elements.userSearchStatus.textContent = 'Searching...';
            try {
                const response = await fetch(`/v1/users/search?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': authorizationHeader() }
                });
                if (!response.ok) throw new Error(`Search failed (${response.status})`);
                const result = await response.json();
                const users = Array.isArray(result) ? result : result.data;

                elements.userSearchResults.innerHTML = '';
                if (!Array.isArray(users) || users.length === 0) {
                    elements.userSearchStatus.textContent = 'No users found.';
                    return;
                }

                elements.userSearchStatus.textContent = `Found ${users.length} user(s). Select one to start chatting.`;
                users.filter(user => Number(user.userId) !== Number(currentUserId)).forEach(user => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'user-result';

                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    if (user.avatar) {
                        const img = document.createElement('img');
                        img.src = user.avatar;
                        img.alt = '';
                        avatar.appendChild(img);
                    } else {
                        avatar.textContent = (user.name || '?').charAt(0).toUpperCase();
                    }

                    const name = document.createElement('span');
                    name.className = 'user-name';
                    name.textContent = user.phoneNumber
                        ? `${user.name || 'User ' + user.userId} · ${user.phoneNumber}`
                        : (user.name || `User ${user.userId}`);

                    const action = document.createElement('span');
                    action.className = 'start-label';
                    action.textContent = 'Chat →';

                    button.append(avatar, name, action);
                    button.onclick = () => createConversationWith(user, button);
                    elements.userSearchResults.appendChild(button);
                });
            } catch (error) {
                elements.userSearchStatus.textContent = error.message || 'Could not search users.';
            }
        }

        async function createConversationWith(user, button) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                elements.userSearchStatus.textContent = 'Chat connection is not ready. Please reconnect.';
                return;
            }

            button.disabled = true;
            elements.userSearchStatus.textContent = 'Creating conversation...';
            try {
                const response = await fetch(`/v1/conversations?userId=${encodeURIComponent(user.userId)}`, {
                    method: 'POST',
                    headers: { 'Authorization': authorizationHeader() }
                });
                const body = await response.json();
                if (!response.ok) {
                    throw new Error(body.detail || `Could not create conversation (${response.status})`);
                }

                // The server stores a conversation-level display name. Use the selected
                // user's current profile for this view so the new chat opens immediately.
                body.name = user.name || body.name || 'New Chat';
                body.profile_image = user.avatar || body.profile_image || null;
                closeNewChatModal();
                loadConversations();
                await openConversation(body);
            } catch (error) {
                elements.userSearchStatus.textContent = error.message || 'Could not create conversation.';
                button.disabled = false;
            }
        }

        elements.newChatBtn.onclick = openNewChatModal;
        elements.closeNewChatBtn.onclick = closeNewChatModal;
        elements.newChatModal.onclick = (event) => {
            if (event.target === elements.newChatModal) closeNewChatModal();
        };
        elements.userSearchInput.oninput = () => {
            clearTimeout(userSearchTimeout);
            userSearchTimeout = setTimeout(searchUsers, 250);
        };
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeNewChatModal();
        });

        elements.loginBtn.onclick = connect;
        elements.sendBtn.onclick = sendMessage;
        elements.msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
        elements.logoutBtn.onclick = () => { location.reload(); };

    </script>
</body>
</html>
