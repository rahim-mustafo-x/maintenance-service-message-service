name: Deploy Message Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-message-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install cloudflared
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 \
            --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

        run: |
          set -euo pipefail

          : "${DEPLOY_SSH_KEY_B64:?Missing DEPLOY_SSH_KEY_B64}"
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${CLOUDFLARE_ACCESS_CLIENT_ID:?Missing Cloudflare Access client ID}"
          : "${CLOUDFLARE_ACCESS_CLIENT_SECRET:?Missing Cloudflare Access client secret}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s' "$DEPLOY_SSH_KEY_B64" \
            | base64 --decode > "$HOME/.ssh/deploy_key"

          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

          cat > "$HOME/.ssh/config" <<EOF
          Host deploy-server
              HostName ${DEPLOY_HOST}
              User ${DEPLOY_USER}
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking accept-new
              ServerAliveInterval 60
              ServerAliveCountMax 10
              ConnectTimeout 15
          EOF

          chmod 600 "$HOME/.ssh/config"

          {
            printf 'CLOUDFLARE_ACCESS_CLIENT_ID=%s\n' "$CLOUDFLARE_ACCESS_CLIENT_ID"
            printf 'CLOUDFLARE_ACCESS_CLIENT_SECRET=%s\n' "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Test SSH connection
        run: |
          set -euo pipefail
          ssh deploy-server "echo 'SSH connection successful'"

      - name: Validate deployment configuration
        env:
          PORT: ${{ secrets.MESSAGE_SERVICE_PORT }}
          EUREKA_URL: ${{ secrets.EUREKA_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          MONGODB_URL: ${{ secrets.MESSAGE_MONGODB_URL }}
          REDIS_HOST: ${{ secrets.MESSAGE_REDIS_HOST }}
          REDIS_PORT: ${{ secrets.MESSAGE_REDIS_PORT }}
          APP_NAME: message-service

        run: |
          set -euo pipefail

          : "${PORT:?Missing MESSAGE_SERVICE_PORT secret}"
          : "${EUREKA_URL:?Missing EUREKA_URL secret}"
          : "${JWT_SECRET_KEY:?Missing JWT_SECRET_KEY secret}"
          : "${MONGODB_URL:?Missing MESSAGE_MONGODB_URL secret}"
          : "${REDIS_HOST:?Missing MESSAGE_REDIS_HOST secret}"
          : "${REDIS_PORT:?Missing MESSAGE_REDIS_PORT secret}"

          if ! [[ "$PORT" =~ ^[0-9]+$ ]] ||
             [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo "Invalid message service port"
            exit 1
          fi

          if [ "$REDIS_HOST" != "maintenance-redis" ]; then
            echo "REDIS_HOST must be maintenance-redis"
            exit 1
          fi

          if [ "$REDIS_PORT" != "6379" ]; then
            echo "REDIS_PORT must be 6379"
            exit 1
          fi

          echo "Deployment configuration validated."

      - name: Deploy Message Service
        env:
          PORT: ${{ secrets.MESSAGE_SERVICE_PORT }}
          EUREKA_URL: ${{ secrets.EUREKA_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          MONGODB_URL: ${{ secrets.MESSAGE_MONGODB_URL }}
          REDIS_HOST: ${{ secrets.MESSAGE_REDIS_HOST }}
          REDIS_PORT: ${{ secrets.MESSAGE_REDIS_PORT }}
          APP_NAME: message-service

        run: |
          set -euo pipefail

          python3 - <<'PY' | ssh deploy-server 'bash -s'
          import os
          import shlex

          names = (
              "PORT",
              "EUREKA_URL",
              "JWT_SECRET_KEY",
              "MONGODB_URL",
              "REDIS_HOST",
              "REDIS_PORT",
              "APP_NAME",
          )

          for name in names:
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"Missing required variable: {name}")
              print(f"export {name}={shlex.quote(value)}")

          print(r'''
          set -euo pipefail

          cd /opt/maintenance-service-message-service

          echo "Updating repository..."
          git fetch origin master
          git reset --hard origin/master

          echo "Generating environment configuration..."
          umask 077

          cat > .env <<ENV_EOF
          PORT=$PORT
          EUREKA_URL=$EUREKA_URL
          JWT_SECRET_KEY=$JWT_SECRET_KEY
          MONGODB_URL=$MONGODB_URL
          REDIS_HOST=$REDIS_HOST
          REDIS_PORT=$REDIS_PORT
          APP_NAME=$APP_NAME
          ENV_EOF

          chmod 600 .env

          echo "Checking shared Redis container..."
          docker inspect maintenance-redis >/dev/null

          if [ "$(docker inspect -f '{{.State.Running}}' maintenance-redis)" != "true" ]; then
              echo "The maintenance-redis container is not running."
              exit 1
          fi

          if ! docker network inspect maintenance-net \
              --format '{{json .Containers}}' | grep -q 'maintenance-redis'; then
              docker network connect maintenance-net maintenance-redis
          fi

          echo "Validating Docker Compose configuration..."
          docker compose config -q

          echo "Building message service..."
          docker compose build --pull message-service

          echo "Recreating message service..."
          docker compose up -d --force-recreate message-service

          echo "Waiting for container startup..."
          for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' message-service 2>/dev/null || true)" = "true" ]; then
                  break
              fi
              sleep 2
          done

          if [ "$(docker inspect -f '{{.State.Running}}' message-service 2>/dev/null || true)" != "true" ]; then
              echo "Message service failed to start."
              docker compose logs --tail=100 message-service
              exit 1
          fi

          echo "Verifying Redis environment inside container..."
          docker exec message-service python -c \
              'import os,sys; h=os.getenv("REDIS_HOST",""); p=os.getenv("REDIS_PORT",""); print(f"REDIS_HOST configured: {bool(h)}; REDIS_PORT configured: {bool(p)}"); sys.exit(0 if h == "maintenance-redis" and p == "6379" else 1)'

          echo "Checking Redis connectivity from message service..."
          docker exec message-service python -c '
          import asyncio, os
          from redis.asyncio import Redis

          async def main():
              client = Redis(
                  host=os.environ["REDIS_HOST"],
                  port=int(os.environ["REDIS_PORT"]),
                  socket_connect_timeout=5,
              )
              try:
                  result = await client.ping()
                  print("Redis PING:", result)
              finally:
                  await client.aclose()

          asyncio.run(main())
          '

          echo "Removing unused Docker images..."
          docker image prune -f

          echo "Container status:"
          docker compose ps

          echo "Recent service logs:"
          docker compose logs --tail=50 message-service

          echo "Deployment completed."
          ''')
          PY