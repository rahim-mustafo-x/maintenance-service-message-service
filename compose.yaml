services:
  message-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: message-service

    env_file:
      - .env

    ports:
      - "${PORT}:${PORT}"

    restart: unless-stopped
    networks:
      - maintenance-net
    depends_on:
      service-registry:
        condition: service_healthy
networks:
  maintenance-net:
    external: true